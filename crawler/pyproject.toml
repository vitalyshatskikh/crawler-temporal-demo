[project]
name = "crawler"
version = "0.1.0"
description = ""
authors = [
    {name = "Vitaly Shatskikh",email = "vvsh.msk@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "temporalio (>=1.31.0,<2.0.0)",
    "orjson (>=3.11.9,<4.0.0)",
    "aiohttp (>=3.9.0,<3.14.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "chevron (>=0.14,<1.0.0)",
    "python-json-logger (>=4.1.0,<5.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "sqlalchemy[asyncio,mypy] (>=2.0.0,<3.0.0)",
    "alembic (>=1.15.0,<2.0.0)",
    "asyncpg (>=0.30.0,<2.0.0)",
]

[tool.poetry]
packages = [
    { include = "shared" },
    { include = "surfer" },
    { include = "downloader" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = ">=0.24,<2.0.0"
pytest-cov = "^7.0.0"
mypy = "^2.3.0"
ruff = "^0.16.1"
aioresponses = "^0.7.9"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["linting", "integration"]

[tool.mypy]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
no_implicit_optional = true
# Note: disallow_any_generics is OFF so test helpers can use bare tuple / list[type]
# implicitly-Any annotations. Production code should still parametrise generics.

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"