name: CI Crawler Go

on:
  push:
    branches: [main]
    paths:
      - 'crawler/parser/**'
      - 'crawler/go.mod'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/ci-crawler-go.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crawler/parser/**'
      - 'crawler/go.mod'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/ci-crawler-go.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crawler-go-ci:
    name: crawler-go
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: crawler/go.mod
          cache: true

      - name: Add GOPATH/bin to PATH
        run: echo "$GOPATH/bin" >> "$GITHUB_PATH"

      - name: Build
        run: go build ./...

      - name: Lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 && golangci-lint run ./...

      - name: Test Unit
        run: go install gotest.tools/gotestsum@v1.12.0 && gotestsum -- -v -race -coverprofile=coverage.out ./...

      - name: Test Integration
        run: echo 'no integration tests for crawler-go yet' && true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          flags: crawler-go
          fail_ci_if_error: false
